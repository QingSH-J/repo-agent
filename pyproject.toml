[project]
name = "repo-agent"
version = "0.1.0"
description = "Interactive coding agent for repo repair"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.0",
    "langchain >= 1.0.0",
    "langchain-deepseek >= 1.0.0",
    "python-dotenv >= 1.0.0",
    "rich >= 13.0.0",
]

[project.scripts]
repo-agent = "repo_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
